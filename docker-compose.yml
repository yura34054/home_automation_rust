services:
  db:
    image: "postgres:16.4-alpine3.20"
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql/data/

    ports:
      - "5432:5432"


volumes:
  postgres:
